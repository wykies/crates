name: Tests and formatting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SQLX_VERSION: 0.9.0 # When changing ensure the cache is invalidated
  APP_USER: db_user
  APP_USER_PWD: password
  APP_DB_NAME: chat_demo

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: wykies/checkout@main
        with:
          submodules: recursive
      - uses: wykies/setup-rust-toolchain@main
      - name: Run tests
        run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: wykies/checkout@main
        with:
          submodules: recursive
      - uses: wykies/setup-rust-toolchain@main
        with:
          components: rustfmt
          cache: false
      - name: Enforce formatting
        run: cargo fmt --check

  clippy:
    name: Clippy (Standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: wykies/checkout@main
        with:
          submodules: recursive
      - uses: wykies/setup-rust-toolchain@main
        with:
          components: clippy
      - name: Load sqlx query files for standalone version
        run: cargo run --bin switch-db -- standalone
      - name: Linting
        run: cargo clippy --all-features -- -D warnings

  wasm:
    name: Clippy WASM
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: wykies/checkout@main
        with:
          submodules: recursive
      - uses: wykies/setup-rust-toolchain@main
        with:
          target: wasm32-unknown-unknown
          components: clippy
      - name: Linting
        run:
          cargo clippy --target="wasm32-unknown-unknown" --package chat-app-client --
          -D warnings

  workspace_lint:
    name: Workspace Lints Inherited
    runs-on: ubuntu-latest
    steps:
      - uses: wykies/checkout@main
        with:
          submodules: recursive
      - uses: wykies/setup-rust-toolchain@main
      - name: Install cargo-workspace-lints
        run: cargo install cargo-workspace-lints --locked
      - name: Run check for inherited lints
        run: cargo workspace-lints
