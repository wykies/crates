dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn" # Rerun has included "See clippy.toml"
disallowed_methods = "warn" # Rerun has included "See clippy.toml"
disallowed_names = "warn" # Rerun has included "See clippy.toml"
disallowed_script_idents = "warn" # Rerun has included "See clippy.toml"
disallowed_types = "warn" # Rerun has included "See clippy.toml"
doc_broken_link = "warn"
doc_comment_double_space_linebreaks = "warn"
doc_include_without_cfg = "warn"
doc_link_with_quotes = "warn"
